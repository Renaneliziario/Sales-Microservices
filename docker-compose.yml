networks:
  sales-infra-net:
    driver: bridge

services:
  postgres:
    image: postgres:16
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - sales-infra-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    networks:
      - sales-infra-net
    depends_on:
      - postgres

  configserver:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: ConfigServer
    container_name: configserver
    restart: unless-stopped
    ports:
      - "8888:8888"
    networks:
      - sales-infra-net

  clienteservice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: ClienteService
    container_name: clienteservice
    restart: unless-stopped
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://configserver:8888
      DB_HOST: postgres
    ports:
      - "8081:8081"
    networks:
      - sales-infra-net
    depends_on:
      - postgres
      - configserver

  produtoservice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: ProdutoService
    container_name: produtoservice
    restart: unless-stopped
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://configserver:8888
      DB_HOST: postgres
    ports:
      - "8082:8082"
    networks:
      - sales-infra-net
    depends_on:
      - postgres
      - configserver

  vendasservice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: VendasService
    container_name: vendasservice
    restart: unless-stopped
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://configserver:8888
      DB_HOST: postgres
      SERVICES_CLIENTE_URL: http://clienteservice:8081
      SERVICES_PRODUTO_URL: http://produtoservice:8082
    ports:
      - "8083:8083"
    networks:
      - sales-infra-net
    depends_on:
      - postgres
      - configserver
      - clienteservice
      - produtoservice
